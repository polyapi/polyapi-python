name: Update python pip package
on:
  push:
    paths:
      - "pyproject.toml"
    branches:
      - develop
      - main

jobs:
  develop-build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/develop' }}
    environment: dev

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Stop if version already exists on PyPI
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        if curl --silent --fail --head "https://pypi.org/pypi/polyapi-python/${VERSION}/json" >/dev/null; then
          echo "Version ${VERSION} already exists on PyPI for polyapi-python."
          echo "Please bump pyproject.toml and push again."
          exit 1
        fi
        echo "Version ${VERSION} is not on PyPI yet, continuing."


    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/


  dev-publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/develop' }}
    needs: develop-build
    environment:
      name: dev
      url: https://pypi.org/p/polyapi-python

    permissions:
      id-token: write
    steps:

    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1


  main-build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: main

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Stop if version already exists on PyPI
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        if curl --silent --fail --head "https://pypi.org/pypi/polyapi-python/${VERSION}/json" >/dev/null; then
          echo "Version ${VERSION} already exists on PyPI for polyapi-python."
          echo "Please bump pyproject.toml and push again."
          exit 1
        fi
        echo "Version ${VERSION} is not on PyPI yet, continuing."

    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/


  main-publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
    - main-build
    runs-on: ubuntu-latest
    environment:
      name: main
      url: https://pypi.org/p/polyapi-python
    permissions:
      id-token: write


    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
